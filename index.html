<!DOCTYPE html>
<html lang="yo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wa iṣẹ́, gba owó ní Naira</title>
  <style>
    :root {
      --ink: #12161c;
      --muted: #5b6673;
      --accent: #0f7b4f;
      --bg: #f7f8f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 40rem;
      width: 100%;
      padding: 2.5rem 2rem;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(18, 22, 28, .06), 0 12px 32px rgba(18, 22, 28, .08);
    }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.6rem, 4.5vw, 2.3rem);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    h1 span { color: var(--accent); }

    p {
      margin: 0;
      font-size: 1.05rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Wa iṣẹ́, kí o sì gba owó ní <span>Naira</span>.</h1>
    <p>Gba àwọn ènìyàn sí iṣẹ́, kí o sì sanwó fún iṣẹ́ tí a ti fọwọ́sí nìkan.</p>
  </main>
</body>
</html>
